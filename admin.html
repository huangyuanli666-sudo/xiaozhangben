<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小账本 · 管理后台</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1a202c;--sub:#6b7280;--primary:#0ea5a4;--red:#ef4444;--green:#10b981;}
*{box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:var(--bg);color:var(--text);min-height:100vh;}
.box{max-width:420px;margin:10vh auto 0;padding:24px;background:var(--card);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.box h1{text-align:center;font-size:22px;margin:0 0 20px;}
input{width:100%;padding:11px;margin-bottom:10px;border:1px solid #ddd;border-radius:10px;font-size:15px;}
.btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
.btn:disabled{opacity:.6;}
.err{color:var(--red);font-size:13px;margin-top:8px;display:none;}
.data{padding:4px 0;}
.data .card{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.data .card .v{font-size:18px;font-weight:700;}
.data .card .k{font-size:12px;color:var(--sub);}
.data .row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:14px;}
.data .row .name{font-weight:600;}
.data .row .meta{font-size:12px;color:var(--sub);}
#panel{display:none;max-width:900px;margin:0 auto;padding:16px 20px 40px;}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 0 16px;}
.topbar h1{font-size:20px;margin:0;}
.topbar button{background:rgba(239,68,68,.12);color:var(--red);border:none;padding:8px 16px;border-radius:8px;font-weight:600;cursor:pointer;}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px;}
</style>
</head>
<body>

<div id="loginWrap" class="box">
  <h1>📊 小账本管理后台</h1>
  <input id="user" placeholder="管理员用户名" autocomplete="username">
  <input id="pass" type="password" placeholder="密码" autocomplete="current-password">
  <button class="btn" id="loginBtn" onclick="doLogin()">登 录</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="panel">
  <div class="topbar"><h1>📊 管理后台</h1><button onclick="doLogout()">退出</button></div>
  <div class="summary" id="summary"></div>
  <div id="userList"></div>
  <div class="err" id="dataErr"></div>
</div>

<script>
// 清除可能无效的旧 token 强制显示登录
if(location.search.includes('fresh')){ localStorage.removeItem('at'); location.href = '/admin'; }

const API = "";
let token = localStorage.getItem("at") || "";

async function api(m, p, b){
  const h = {"Content-Type":"application/json"};
  if(token) h["Authorization"] = "Bearer " + token;
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), 15000);
  try{
    const r = await fetch(API+p, {method:m, headers:h, body:b?JSON.stringify(b):undefined, signal:c.signal});
    const d = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(d.detail || "HTTP "+r.status);
    return d;
  }finally{clearTimeout(t);}
}

function showErr(id, msg){
  const el = document.getElementById(id);
  el.textContent = msg; el.style.display = msg ? "" : "none";
}

async function doLogin(){
  const u = document.getElementById("user").value.trim();
  const p = document.getElementById("pass").value.trim();
  if(!u||!p) return;
  const btn = document.getElementById("loginBtn");
  btn.disabled = true; btn.textContent = "登录中..."; showErr("loginErr","");
  try{
    const r = await api("POST","/api/login",{username:u,password:p});
    if(!r.user.isAdmin) throw new Error("非管理员账号");
    token = r.token;
    localStorage.setItem("at", token);
    document.getElementById("loginWrap").style.display = "none";
    document.getElementById("panel").style.display = "";
    await loadData();
  }catch(e){
    showErr("loginErr", "登录失败: "+e.message);
    btn.disabled = false; btn.textContent = "登 录";
  }
}

async function loadData(){
  showErr("dataErr","");
  document.getElementById("summary").innerHTML = "";
  document.getElementById("userList").innerHTML = "加载中...";
  try{
    const [s, users] = await Promise.all([api("GET","/api/admin/summary"), api("GET","/api/admin/users")]);
    document.getElementById("summary").innerHTML =
      '<div class="card"><div class="v">'+s.totalUsers+'</div><div class="k">用户数</div></div>'+
      '<div class="card"><div class="v">'+s.totalBills+'</div><div class="k">总账单</div></div>'+
      '<div class="card"><div class="v" style="color:var(--red)">¥'+(s.totalExpense/100).toLocaleString()+'</div><div class="k">总支出</div></div>'+
      '<div class="card"><div class="v" style="color:var(--green)">¥'+(s.totalIncome/100).toLocaleString()+'</div><div class="k">总收入</div></div>';
    let h = "";
    users.forEach(u => {
      h += '<div class="row"><span class="name">'+(u.nickname||u.username)+(u.isAdmin?' 👑':'')+'</span><span class="meta">'+u.username+' · '+(u.createdAt||'').slice(0,10)+'</span></div>';
    });
    document.getElementById("userList").innerHTML = h || '(无用户)';
  }catch(e){
    showErr("dataErr","数据加载失败: "+e.message);
    document.getElementById("userList").innerHTML = "";
  }
}

function doLogout(){
  token = ""; localStorage.removeItem("at");
  document.getElementById("loginWrap").style.display = "";
  document.getElementById("panel").style.display = "none";
}

// 自动登录
if(token){
  document.getElementById("loginWrap").style.display = "none";
  document.getElementById("panel").style.display = "";
  loadData();
}
</script>
</body>
</html>
